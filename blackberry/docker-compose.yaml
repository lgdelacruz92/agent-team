services:
  mattermost-db:
    image: postgres:16-alpine
    container_name: mattermost-db
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8065:8065"
    env_file: .env
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
    depends_on:
      mattermost-db:
        condition: service_healthy

  # Docker creates named volumes owned by root, but vikunja runs as uid 1000. This one-shot
  # container hands the volume to that user before vikunja starts.
  vikunja-init:
    image: busybox:stable
    container_name: vikunja-init
    platform: linux/amd64
    user: "0:0"
    command: chown -R 1000:0 /app/vikunja/files
    volumes:
      - vikunja-files:/app/vikunja/files

  # Task boards. Uses SQLite in its own volume, so it adds no load to mattermost-db.
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3456:3456"
    env_file: .env
    volumes:
      - vikunja-files:/app/vikunja/files
    depends_on:
      vikunja-init:
        condition: service_completed_successfully

volumes:
  mattermost-db-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  vikunja-files:
