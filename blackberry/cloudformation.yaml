AWSTemplateFormatVersion: "2010-09-09"
Description: Blackberry EC2 instance (software installed separately via Systems Manager), reached through Session Manager, in an existing VPC.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC to deploy into.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing public subnet for the instance. Changing it replaces the instance. It needs a route to an internet gateway so the SSM agent and Docker can reach the internet.
  InstanceType:
    Type: String
    Default: t3.medium
    Description: Must be x86_64 (the containers run as linux/amd64).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VolumeSizeGiB:
    Type: Number
    Default: 30

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Do not edit: GroupDescription cannot be updated in place, so changing it replaces this
      # security group and with it the instance. The wording is stale (there is no ALB now).
      GroupDescription: Blackberry instance - app port from the ALB only
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Shell access through Session Manager; no SSH port is opened.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-blackberry

Outputs:
  InstanceId:
    Value: !Ref Instance
    Description: Connect with `aws ssm start-session --target <id>`.
  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
    Description: Pass to the agent-team stack (BlackberrySecurityGroupId) so it can reach Mattermost and Vikunja.
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
    Description: Address other instances in the VPC use to reach Mattermost (8065) and Vikunja (3456).
