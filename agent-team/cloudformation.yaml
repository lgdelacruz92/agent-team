AWSTemplateFormatVersion: "2010-09-09"
Description: Agent team EC2 instance (OpenCode CTO and workers; software installed separately), reached through Session Manager, in an existing VPC.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC to deploy into. Can be the same VPC as the blackberry stack.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing public subnet for the instance. It needs a route to an internet gateway so the SSM agent and Docker can reach the internet.
  InstanceType:
    Type: String
    Default: t3.large
    Description: Must be x86_64.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VolumeSizeGiB:
    Type: Number
    Default: 50
    Description: Root volume. The agents' workspace and Docker images live here.

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Agent team instance - no inbound access, Session Manager only
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Shell access through Session Manager; no SSH port is opened.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-agents

Outputs:
  InstanceId:
    Value: !Ref Instance
    Description: Connect with `aws ssm start-session --target <id>`.
