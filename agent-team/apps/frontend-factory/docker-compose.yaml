services:
  frontend:
    build: ../images/frontend
    image: frontend-factory-frontend:local
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file: .env.local
    working_dir: /workspace
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"frontend"}'
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export GITHUB_TOKEN="$${FRONTEND_GITHUB_TOKEN:-$${GITHUB_TOKEN:-}}";
        export GH_TOKEN="$$GITHUB_TOKEN";
        exec opencode serve --hostname 0.0.0.0 --port 4096 --print-logs --log-level debug
    ports:
      - "127.0.0.1:4098:4096"
    volumes:
      - ../workspace:/workspace
      - ../opencode.json:/workspace/opencode.json:ro
      - ../agents/frontend.md:/root/.config/opencode/agents/frontend.md:ro
      - ../agents:/root/.config/opencode/team:ro
      - ../plugins/compact:/root/.config/opencode/plugins/compact:ro
      - ../plugins/vikunja:/root/.config/opencode/plugins/vikunja:ro
      - frontend-data:/root/.local/share/opencode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${OPENCODE_SERVER_PASSWORD:-}" ]; then
            curl -fsS --user "$${OPENCODE_SERVER_USERNAME:-opencode}:$$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/api/info >/dev/null;
          else
            curl -fsS http://127.0.0.1:4096/api/info >/dev/null;
          fi
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  scheduler:
    build: ../scheduler
    restart: unless-stopped
    env_file: .env.local
    entrypoint: ["/bin/sh", "/factory/start-app.sh"]
    command: ["node", "dist/index.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      SCHEDULER_DB_PATH: /shared-db/db.sqlite
    volumes:
      - .:/shared-db
      - ./start-app.sh:/factory/start-app.sh:ro
    ports:
      - "127.0.0.1:3300:3300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  agent-resource-manager:
    build: ../agent-resource-manager
    restart: unless-stopped
    env_file: .env.local
    entrypoint: ["/bin/sh", "/factory/start-app.sh"]
    command: ["node", "dist/index.js"]
    environment:
      RESOURCE_MANAGER_DB_PATH: /shared-db/db.sqlite
    volumes:
      - .:/shared-db
      - ./start-app.sh:/factory/start-app.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_healthy
      scheduler:
        condition: service_healthy

volumes:
  frontend-data:
