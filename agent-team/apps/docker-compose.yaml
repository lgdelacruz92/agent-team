
x-opencode: &opencode
  # Adds bash and curl. Own tag so the build does not overwrite the pulled opencode image.
  build: ./images/base
  image: opencode-base:local
  restart: unless-stopped
  # tty + stdin_open so `docker exec -it` / `docker attach` get a usable terminal.
  tty: true
  stdin_open: true
  env_file: ${ENV_FILE:-.env.local}
  working_dir: /workspace
  networks:
    - shared

x-opencode-command: &opencode-command
  - serve
  - --hostname
  - 0.0.0.0
  - --port
  - "4096"
  - --print-logs
  - --log-level
  - debug

services:
  # You talk to this one. The CTO plans the work and creates tickets in Vikunja.
  cto:
    <<: *opencode
    container_name: opencode-cto
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"cto"}'
    volumes:
      - ./workspace:/workspace
      - ./oc.json:/workspace/opencode.json:ro
      - ./agents/cto.md:/root/.config/opencode/agents/cto.md:ro
      - ./agents:/root/.config/opencode/team:ro
      - ./plugins/compact:/root/.config/opencode/plugins/compact:ro
      - ./plugins/vikunja:/root/.config/opencode/plugins/vikunja:ro
      - cto-data:/root/.local/share/opencode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: *opencode-command

  backend:
    <<: *opencode
    container_name: opencode-backend
    ports:
      - "127.0.0.1:4097:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"backend"}'
    volumes:
      - ./workspace:/workspace
      - ./oc.json:/workspace/opencode.json:ro
      - ./agents/backend.md:/root/.config/opencode/agents/backend.md:ro
      - ./agents:/root/.config/opencode/team:ro
      - ./plugins/compact:/root/.config/opencode/plugins/compact:ro
      - backend-data:/root/.local/share/opencode
    command: *opencode-command

  frontend:
    <<: *opencode
    # Adds git and gh on top of bash and curl. Own tag so the build does not overwrite the pulled opencode image.
    build: ./images/frontend
    image: opencode-frontend:local
    container_name: opencode-frontend
    ports:
      - "127.0.0.1:4098:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"frontend"}'
      GITHUB_TOKEN: ${FRONTEND_GITHUB_TOKEN:-}
      GH_TOKEN: ${FRONTEND_GITHUB_TOKEN:-}
    volumes:
      - ./workspace:/workspace
      - ./oc.json:/workspace/opencode.json:ro
      - ./agents/frontend.md:/root/.config/opencode/agents/frontend.md:ro
      - ./agents:/root/.config/opencode/team:ro
      - ./plugins/compact:/root/.config/opencode/plugins/compact:ro
      - ./plugins/vikunja:/root/.config/opencode/plugins/vikunja:ro
      - frontend-data:/root/.local/share/opencode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: *opencode-command

  aws-architect:
    <<: *opencode
    container_name: opencode-aws-architect
    ports:
      - "127.0.0.1:4099:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"aws-solutions-architect"}'
    volumes:
      - ./workspace:/workspace
      - ./oc.json:/workspace/opencode.json:ro
      - ./agents/aws-solutions-architect.md:/root/.config/opencode/agents/aws-solutions-architect.md:ro
      - ./agents:/root/.config/opencode/team:ro
      - ./plugins/compact:/root/.config/opencode/plugins/compact:ro
      - aws-architect-data:/root/.local/share/opencode
    command: *opencode-command

  # Lets the allowed Mattermost users talk to the CTO. Reaches Mattermost through the SSM port forward
  # on the host (blackberry/ssh-ec2.sh --forward) and the CTO over the shared network.
  bridge:
    build: ./bridge
    container_name: opencode-bridge
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.local}
    working_dir: /app
    environment:
      OPENCODE_URL: http://opencode-cto:4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - bridge-data:/data
    networks:
      - shared
    depends_on:
      - cto
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Feeds the frontend worker one ticket at a time from Vikunja and saves worker session IDs.
  frontend-ctr:
    build: ./frontend-ctr
    container_name: opencode-frontend-ctr
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.local}
    working_dir: /app
    environment:
      CTR_SESSIONS_FILE: /data/sessions.json
    volumes:
      - frontend-ctr-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Node inspector on 9229 so VS Code can attach (frontend-ctr/.vscode/launch.json).
    command: ["node", "--inspect=0.0.0.0:9229", "dist/index.js"]
    ports:
      - "127.0.0.1:3200:3000"
      - "127.0.0.1:9229:9229"
    networks:
      - shared
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Both apps use the same prepared SQLite database and its WAL files.
  scheduler:
    build: ./scheduler
    container_name: agent-scheduler
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.local}
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      SCHEDULER_DB_PATH: /shared-db/db.sqlite
      VIKUNJA_PROJECT_ID: ${CTR_PROJECT_ID:-2}
      VIKUNJA_VIEW_ID: ${CTR_VIEW_ID:-12}
    #       baseUrl: process.env.VIKUNJA_URL ?? "",
    # token: process.env.VIKUNJA_API_TOKEN ?? "",
    # projectId: Number(process.env.VIKUNJA_PROJECT_ID ?? "0"),
    # viewId: Number(process.env.VIKUNJA_VIEW_ID ?? "0"),

    volumes:
      - ./shared-db:/shared-db
    ports:
      - "127.0.0.1:3300:3300"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared

  # This service can dispatch work to agents and move Vikunja cards.
  agent-resource-manager:
    build: ./agent-resource-manager
    container_name: agent-resource-manager
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.local}
    environment:
      RESOURCE_MANAGER_DB_PATH: /shared-db/db.sqlite
      VIKUNJA_PROJECT_ID: ${CTR_PROJECT_ID:-2}
      VIKUNJA_VIEW_ID: ${CTR_VIEW_ID:-12}
    volumes:
      - ./shared-db:/shared-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared

volumes:
  cto-data:
  backend-data:
  frontend-data:
  aws-architect-data:
  bridge-data:
  frontend-ctr-data:

networks:
  shared:
    name: shared
