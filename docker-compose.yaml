
x-opencode: &opencode
  image: ghcr.io/anomalyco/opencode:latest
  restart: unless-stopped
  platform: linux/amd64
  env_file: .env
  working_dir: /workspace
  networks:
    - shared

x-opencode-command: &opencode-command
  - serve
  - --hostname
  - 0.0.0.0
  - --port
  - "4096"
  - --print-logs
  - --log-level
  - DEBUG

services:
  # You talk to this one. It plans the work and delegates to backend, frontend and aws-architect.
  planner:
    <<: *opencode
    container_name: opencode-planner
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"planner"}'
      # delegate tool reaches the workers over the shared network
      BACKEND_URL: http://opencode-backend:4096
      FRONTEND_URL: http://opencode-frontend:4096
      AWS_ARCHITECT_URL: http://opencode-aws-architect:4096
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/planner.md:/root/.config/opencode/agents/planner.md:ro
      - ./tools/delegate.ts:/root/.config/opencode/tools/delegate.ts:ro
      - planner-data:/root/.local/share/opencode
    depends_on:
      - backend
      - frontend
      - aws-architect
    command: *opencode-command

  backend:
    <<: *opencode
    container_name: opencode-backend
    ports:
      - "127.0.0.1:4097:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"backend"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/backend.md:/root/.config/opencode/agents/backend.md:ro
      - backend-data:/root/.local/share/opencode
    command: *opencode-command

  frontend:
    <<: *opencode
    container_name: opencode-frontend
    ports:
      - "127.0.0.1:4098:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"frontend"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/frontend.md:/root/.config/opencode/agents/frontend.md:ro
      - frontend-data:/root/.local/share/opencode
    command: *opencode-command

  aws-architect:
    <<: *opencode
    container_name: opencode-aws-architect
    ports:
      - "127.0.0.1:4099:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"aws-solutions-architect"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/aws-solutions-architect.md:/root/.config/opencode/agents/aws-solutions-architect.md:ro
      - aws-architect-data:/root/.local/share/opencode
    command: *opencode-command

  mattermost-db:
    image: postgres:16-alpine
    container_name: mattermost-db
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    volumes:
      - mattermost-db-data:/var/lib/postgresql/data
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8065:8065"
    env_file: .env
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
    networks:
      - shared
    depends_on:
      mattermost-db:
        condition: service_healthy

volumes:
  planner-data:
  backend-data:
  frontend-data:
  aws-architect-data:
  mattermost-db-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:

networks:
  shared:
    name: shared
