
x-opencode: &opencode
  image: ghcr.io/anomalyco/opencode:latest
  restart: unless-stopped
  platform: linux/amd64
  env_file: .env
  working_dir: /workspace
  networks:
    - shared

x-opencode-command: &opencode-command
  - serve
  - --hostname
  - 0.0.0.0
  - --port
  - "4096"
  - --print-logs
  - --log-level
  - DEBUG

services:
  # You talk to this one. The CTO plans the work and delegates to the backend, frontend and aws-architect team members.
  cto:
    <<: *opencode
    container_name: opencode-cto
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"cto"}'
      # delegate tool reaches the workers over the shared network
      BACKEND_URL: http://opencode-backend:4096
      FRONTEND_URL: http://opencode-frontend:4096
      AWS_ARCHITECT_URL: http://opencode-aws-architect:4096
      # vikunja tool reaches Vikunja through the SSM port forward on the host (ssh-ec2.sh --forward vikunja)
      VIKUNJA_URL: http://host.docker.internal:3456
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/cto.md:/root/.config/opencode/agents/cto.md:ro
      - ./tools/delegate.ts:/root/.config/opencode/tools/delegate.ts:ro
      - ./tools/vikunja.ts:/root/.config/opencode/tools/vikunja.ts:ro
      - cto-data:/root/.local/share/opencode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
      - aws-architect
    command: *opencode-command

  backend:
    <<: *opencode
    container_name: opencode-backend
    ports:
      - "127.0.0.1:4097:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"backend"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/backend.md:/root/.config/opencode/agents/backend.md:ro
      - backend-data:/root/.local/share/opencode
    command: *opencode-command

  frontend:
    <<: *opencode
    container_name: opencode-frontend
    ports:
      - "127.0.0.1:4098:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"frontend"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/frontend.md:/root/.config/opencode/agents/frontend.md:ro
      - frontend-data:/root/.local/share/opencode
    command: *opencode-command

  aws-architect:
    <<: *opencode
    container_name: opencode-aws-architect
    ports:
      - "127.0.0.1:4099:4096"
    environment:
      OPENCODE_CONFIG_CONTENT: '{"default_agent":"aws-solutions-architect"}'
    volumes:
      - ./workspace:/workspace
      - ./opencode.json:/workspace/opencode.json:ro
      - ./agents/aws-solutions-architect.md:/root/.config/opencode/agents/aws-solutions-architect.md:ro
      - aws-architect-data:/root/.local/share/opencode
    command: *opencode-command

volumes:
  cto-data:
  backend-data:
  frontend-data:
  aws-architect-data:

networks:
  shared:
    name: shared
